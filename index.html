<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caladan Focus</title>

<style>
:root{
    --bg:#00141d;
    --bg2:#00212b;

    --surface:#073642;
    --surface-light:#0b4457;
    --border:#164b5b;

    --text:#e8ece9;
    --muted:#93a1a1;

    --cyan:#2aa198;
    --blue:#268bd2;
    --green:#859900;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
}

body{
    background:
        radial-gradient(circle at top,#09384b 0%,transparent 45%),
        linear-gradient(180deg,var(--bg),var(--bg2));

    color:var(--text);
    font-family:Inter,Segoe UI,system-ui,sans-serif;
    overflow:hidden;
}

/* HEADER */

header{
    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    border-bottom:1px solid var(--border);

    background:rgba(0,0,0,.15);
    backdrop-filter:blur(10px);
}

header h1{
    font-size:20px;
    color:var(--cyan);
    letter-spacing:.08em;
}

#clock{
    color:var(--muted);
    font-size:15px;
}

/* LAYOUT */

.container{

    display:grid;
    grid-template-columns:340px 1fr;

    height:calc(100vh - 64px);

}

/* LEFT */

.sidebar{

    display:flex;
    flex-direction:column;
    gap:18px;

    padding:20px;

    border-right:1px solid var(--border);

}

/* PANEL */

.panel{

    background:rgba(7,54,66,.75);

    border:1px solid var(--border);

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(0,0,0,.2);

}

.panel h2{

    padding:12px 16px;

    font-size:13px;

    letter-spacing:.15em;

    text-transform:uppercase;

    color:var(--cyan);

    border-bottom:1px solid var(--border);

}

/* PLAYER */

.player iframe{

    width:100%;
    aspect-ratio:16/9;

    border:none;

    display:block;

}

/* EDITOR */

.editor{

    padding:20px;

    display:flex;

}

.notes{

    flex:1;

    display:flex;
    flex-direction:column;

}

textarea{

    flex:1;

    width:100%;

    resize:none;

    border:none;
    outline:none;

    border-radius:14px;

    padding:26px;

    background:rgba(7,54,66,.78);

    color:var(--text);

    font-size:16px;

    line-height:1.8;

    font-family:
        "JetBrains Mono",
        Consolas,
        monospace;

    border:1px solid var(--border);

}

textarea::placeholder{
    color:#6e8a8d;
}

/* FOOTER */

footer{

    position:fixed;

    right:20px;
    bottom:12px;

    color:#4d6b6f;

    font-size:12px;

}

/* Scroll */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#335b64;
    border-radius:20px;
}

::-webkit-scrollbar-track{
    background:transparent;
}
</style>

</head>
<body>

<header>

    <h1>Caladan Focus</h1>

    <div id="clock"></div>

</header>

<div class="container">

    <aside class="sidebar">

        <div class="panel player">

            <div class="panel player">

                <h2>Música</h2>

                <div class="player-controls">
                    <input
                        id="music-url"
                        type="text"
                        placeholder="Cole uma URL do YouTube">

                    <button onclick="updatePlayer('music')">
                        Atualizar
                    </button>
                </div>

                <iframe
                    id="music-player"
                    allow="autoplay; encrypted-media"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

        <div class="panel player">

            <div class="panel player">

                <h2>Brown Noise</h2>

                <div class="player-controls">
                    <input
                        id="noise-url"
                        type="text"
                        placeholder="Cole uma URL do YouTube">

                    <button onclick="updatePlayer('noise')">
                        Atualizar
                    </button>
                </div>

                <iframe
                    id="noise-player"
                    allow="autoplay; encrypted-media"
                    allowfullscreen>
                </iframe>

            </div>  

        </div>

    </aside>

    <main class="editor">

        <div class="notes">

<textarea id="notes" placeholder="# Anotações

• Tarefas
• Ideias
• Lembretes

Tudo é salvo automaticamente.
"></textarea>

        </div>

    </main>

</div>

<footer>
Solarized Osaka Focus
</footer>

<script>

const textarea = document.getElementById("notes");

textarea.value = localStorage.getItem("focus-notes") || "";

textarea.addEventListener("input", () => {

    localStorage.setItem("focus-notes", textarea.value);

});

function updateClock(){

    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleDateString("pt-BR") +
        " • " +
        now.toLocaleTimeString("pt-BR");

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
